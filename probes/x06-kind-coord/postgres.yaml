apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-init
  namespace: x06
data:
  00-trial.sql: |
    CREATE DATABASE http;
    CREATE DATABASE grpc;
---
apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: x06
spec:
  selector:
    app: pg
  ports:
    - port: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: pg
  namespace: x06
  labels:
    app: pg
spec:
  nodeName: ieo-x06-worker2
  automountServiceAccountToken: false
  containers:
    - name: pg
      image: docker.io/library/postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
      env:
        - name: POSTGRES_USER
          value: x06
        - name: POSTGRES_PASSWORD
          value: x06-ephemeral-fixture
      readinessProbe:
        exec:
          command: ["pg_isready", "-h", "127.0.0.1", "-U", "x06", "-d", "grpc"]
        periodSeconds: 1
      volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: init
      configMap:
        name: pg-init
    - name: data
      emptyDir: {}
