name: 08-05 isolated P11 boundaries

on:
  push:
    branches: [task/0805-policy-boundaries]

permissions:
  contents: read

concurrency:
  group: 0805-isolated-p11
  cancel-in-progress: false

jobs:
  p11-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned kind and kubectl
        run: |
          bin="$RUNNER_TEMP/0805-bin"
          mkdir "$bin"
          curl -fsSL --retry 3 -o "$bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          printf '%s  %s\n' eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa "$bin/kind" | sha256sum -c
          url=https://dl.k8s.io/release/v1.35.0/bin/linux/amd64
          curl -fsSL --retry 3 -o "$bin/kubectl" "$url/kubectl"
          curl -fsSL --retry 3 -o "$bin/kubectl.sha256" "$url/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$bin/kubectl.sha256")" "$bin/kubectl" | sha256sum -c
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run P11 in a disposable VM and delete its cluster
        run: bash probes/0805-policy-boundaries/run-lab.sh "$RUNNER_TEMP/0805-lab"
      - name: Preserve raw test evidence
        if: always()
        run: |
          dir="$RUNNER_TEMP/0805-lab"
          if [[ -d "$dir/evidence" ]]; then
            tar -C "$dir" -czf "$RUNNER_TEMP/0805-evidence.tar.gz" evidence
            sha256sum "$RUNNER_TEMP/0805-evidence.tar.gz"
            echo 0805_EVIDENCE_BEGIN
            base64 -w 96 "$RUNNER_TEMP/0805-evidence.tar.gz"
            echo 0805_EVIDENCE_END
          fi
