name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-validate:
    name: docs/poc package and progress validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements-poc.txt
      - name: validate_package.py (document consistency only, not runtime)
        working-directory: docs/poc
        run: python scripts/validate_package.py
      - name: render_progress.py --check
        working-directory: docs/poc
        run: python scripts/render_progress.py --check
      - name: render_progress.py behaviour tests (01-06, temporary copies)
        working-directory: docs/poc
        run: python scripts/test_render_progress.py
      - name: OpenAPI contract (external $ref resolved)
        working-directory: contracts
        run: openapi-spec-validator ieo-api-v0.openapi.yaml
  rust-toolchain:
    name: rust toolchain pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: pinned versions
        run: |
          rustc -V | tee /dev/stderr | grep -q '^rustc 1\.99\.1 '
          cargo fmt --version | tee /dev/stderr | grep -q '^rustfmt 1\.10\.0-stable '
          cargo clippy --version | tee /dev/stderr | grep -q '^clippy 0\.1\.99 '
  rust-check:
    name: rust fmt clippy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets
      - name: plan manifest digests and draft registration (all 9 accepted as draft)
        run: cargo run --locked -q --bin ieo-spec -- check-manifest docs/poc/Console_Coordinator_Sprints_v0.json > /dev/null
