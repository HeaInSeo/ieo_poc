name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-validate:
    name: docs/poc package and progress validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements-poc.txt
      - name: validate_package.py (document consistency only, not runtime)
        working-directory: docs/poc
        run: python scripts/validate_package.py
      - name: render_progress.py --check
        working-directory: docs/poc
        run: python scripts/render_progress.py --check
  rust-toolchain:
    name: rust toolchain pin resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: pinned versions
        run: |
          rustc -V | tee /dev/stderr | grep -q '^rustc 1\.99\.1 '
          cargo fmt --version
          cargo clippy --version
