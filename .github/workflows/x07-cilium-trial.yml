name: X-07 isolated Cilium trial

on:
  push:
    branches: [task/x07-cilium-grpc]

permissions:
  contents: read

concurrency:
  group: x07-cilium-trial
  cancel-in-progress: false

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      KIND_EXPERIMENTAL_PROVIDER: docker
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the disposable VM and prepare fixture
        run: |
          df -h / "$HOME"
          uname -r
          kernel=$(uname -r)
          [[ "$(printf '%s\n' 5.14 "${kernel%%-*}" | sort -V | head -1)" == 5.14 ]]
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          docker info --format 'cgroup={{.CgroupVersion}} driver={{.CgroupDriver}} opts={{json .SecurityOptions}}'
          test "$(docker info --format '{{.CgroupVersion}}')" = 2
          test "$(docker info --format '{{json .SecurityOptions}}' | jq '[.[] | contains("rootless")] | any')" = false
          cargo build --locked -p ieo-x05-probe
          mkdir "$RUNNER_TEMP/x07-fixture"
          install -m 0755 target/debug/ieo-x05-probe "$RUNNER_TEMP/x07-fixture/ieo-x05-probe"
          strip "$RUNNER_TEMP/x07-fixture/ieo-x05-probe"
          sha256sum "$RUNNER_TEMP/x07-fixture/ieo-x05-probe"
          cp probes/x05-kind-grpc/Containerfile "$RUNNER_TEMP/x07-fixture/Containerfile"
          docker build --network none -t localhost/ieo-x05:fixture \
            -f "$RUNNER_TEMP/x07-fixture/Containerfile" "$RUNNER_TEMP/x07-fixture"
      - name: Create a Cilium-ready four-node cluster
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind-x07" https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          echo "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  $RUNNER_TEMP/kind-x07" | sha256sum -c
          chmod 0755 "$RUNNER_TEMP/kind-x07"
          binaries="$RUNNER_TEMP/x07-bin"
          mkdir "$binaries"
          base=https://dl.k8s.io/release/v1.35.0/bin/linux/amd64
          curl -fsSL --retry 3 -o "$binaries/kubectl" "$base/kubectl"
          curl -fsSL --retry 3 -o "$binaries/kubectl.sha256" "$base/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$binaries/kubectl.sha256")" "$binaries/kubectl" | sha256sum -c
          chmod 0755 "$binaries/kubectl"
          echo "$binaries" >> "$GITHUB_PATH"
          "$binaries/kubectl" version --client
          kind="$RUNNER_TEMP/kind-x07"
          config="$RUNNER_TEMP/x07-kubeconfig"
          "$kind" version
          "$kind" create cluster --config probes/x07-cilium-grpc/kind.yaml --kubeconfig "$config" \
            --image docker.io/kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
          "$kind" load docker-image localhost/ieo-x05:fixture --name ieo-x07
          for node in ieo-x07-control-plane ieo-x07-worker ieo-x07-worker2 ieo-x07-worker3; do
            printf '%s ' "$node"
            docker exec "$node" readlink /proc/self/ns/cgroup
          done
          printf 'runner '
          readlink /proc/self/ns/cgroup
      - name: Verify and install pinned Cilium
        run: |
          helm version --short
          chart=oci://quay.io/cilium/charts/cilium
          digest=sha256:873a782bf1064b08fbb05f64c4ed50fcb66d6f05f981f817bddd91f038b69935
          helm pull "$chart" --version 1.20.5 --destination "$RUNNER_TEMP" 2>&1 | tee "$RUNNER_TEMP/x07-chart.log"
          grep -Fx "Digest: $digest" "$RUNNER_TEMP/x07-chart.log"
          api_ip=$(docker inspect -f '{{ (index .NetworkSettings.Networks "kind").IPAddress }}' ieo-x07-control-plane)
          config="$RUNNER_TEMP/x07-kubeconfig"
          k=(kubectl --kubeconfig "$config" --context kind-ieo-x07)
          deadline=$((SECONDS + 300))
          helm install cilium "$RUNNER_TEMP/cilium-1.20.5.tgz" --kubeconfig "$config" --kube-context kind-ieo-x07 \
            -n kube-system -f probes/x07-cilium-grpc/cilium-values.yaml \
            --set-string "k8sServiceHost=$api_ip" --set "k8sServicePort=6443" --wait --timeout 295s
          remaining=$((deadline - SECONDS))
          test "$remaining" -gt 0
          "${k[@]}" wait --for=condition=Ready node --all --timeout="${remaining}s"
          "${k[@]}" -n kube-system get pods -o wide
      - name: Run frozen L4 control and Cilium L7 scenarios
        run: |
          python3 probes/x07-cilium-grpc/run.py --kubeconfig "$RUNNER_TEMP/x07-kubeconfig" \
            --evidence "$RUNNER_TEMP/x07-evidence"
      - name: Preserve diagnostics and trial evidence
        if: always()
        run: |
          evidence="$RUNNER_TEMP/x07-evidence"
          mkdir -p "$evidence"
          config="$RUNNER_TEMP/x07-kubeconfig"
          if [[ -f "$config" ]]; then
            k=(kubectl --kubeconfig "$config" --context kind-ieo-x07 --request-timeout=12s -n kube-system)
            "${k[@]}" get pods,deployments,daemonsets,nodes -o wide > "$evidence/kube-system-status.txt" 2>&1 || true
            "${k[@]}" get events --sort-by=.lastTimestamp > "$evidence/kube-system-events.txt" 2>&1 || true
            "${k[@]}" logs -l k8s-app=cilium --all-containers --tail=40 --prefix > "$evidence/cilium-log.txt" 2>&1 || true
          fi
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/x07-evidence.tar.gz" x07-evidence
          sha256sum "$RUNNER_TEMP/x07-evidence.tar.gz"
          echo X07_EVIDENCE_BEGIN
          base64 -w 96 "$RUNNER_TEMP/x07-evidence.tar.gz"
          echo X07_EVIDENCE_END
      - name: Remove test nodes
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/kind-x07" ]]; then
            "$RUNNER_TEMP/kind-x07" delete cluster --name ieo-x07 --kubeconfig "$RUNNER_TEMP/x07-kubeconfig"
          fi
