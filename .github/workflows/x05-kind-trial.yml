name: X-05 isolated kind trial

on:
  push:
    branches: [task/x05-kind-grpc]

permissions:
  contents: read

concurrency:
  group: x05-kind-trial
  cancel-in-progress: false

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KIND_EXPERIMENTAL_PROVIDER: podman
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare space and rootless runtime
        run: |
          df -h / "${HOME}"
          stat -fc %T /sys/fs/cgroup
          systemctl --version | head -1
          podman --version
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          systemd-run --user --scope --quiet -p Delegate=yes podman info --format json |
            python3 -c 'import json,sys; h=json.load(sys.stdin)["host"]; print(h["security"]["rootless"], h["cgroupVersion"], h["cgroupControllers"]); assert h["security"]["rootless"] and h["cgroupVersion"] == "v2" and set(h["cgroupControllers"]) >= {"cpu","memory","pids"}'
      - name: Build the fixture and pack its image
        run: |
          rustup show
          cargo build --locked -p ieo-x05-probe
          image_context="$RUNNER_TEMP/x05-image"
          mkdir "$image_context"
          install -m 755 target/debug/ieo-x05-probe "$image_context/ieo-x05-probe"
          strip "$image_context/ieo-x05-probe"
          cp probes/x05-kind-grpc/Containerfile "$image_context/Containerfile"
          podman build --network none -t localhost/ieo-x05:fixture "$image_context"
          podman image inspect --format 'id={{.Id}} size={{.Size}} user={{.User}}' localhost/ieo-x05:fixture
          podman save --format docker-archive -o "$RUNNER_TEMP/x05-fixture.tar" localhost/ieo-x05:fixture
          sha256sum "$RUNNER_TEMP/x05-fixture.tar"
      - name: Install pinned kind release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kind-x05" https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          echo "eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa  $RUNNER_TEMP/kind-x05" | sha256sum -c
          chmod 0755 "$RUNNER_TEMP/kind-x05"
          "$RUNNER_TEMP/kind-x05" version
          kubectl version --client
      - name: Create and load the dedicated cluster
        run: |
          df -h / "${HOME}"
          kind="$RUNNER_TEMP/kind-x05"
          kubeconfig="$RUNNER_TEMP/x05-kubeconfig"
          systemd-run --user --scope --quiet -p Delegate=yes "$kind" create cluster \
            --config probes/x05-kind-grpc/kind.yaml \
            --image docker.io/kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f \
            --kubeconfig "$kubeconfig" --wait 120s
          systemd-run --user --scope --quiet -p Delegate=yes "$kind" load image-archive \
            --name ieo-x05 "$RUNNER_TEMP/x05-fixture.tar"
          kubectl --kubeconfig "$kubeconfig" --context kind-ieo-x05 wait --for=condition=Ready node --all --timeout=120s
          kubectl --kubeconfig "$kubeconfig" --context kind-ieo-x05 -n kube-system rollout status daemonset/kindnet --timeout=120s
      - name: Run the frozen trial
        run: |
          python3 probes/x05-kind-grpc/run.py --kubeconfig "$RUNNER_TEMP/x05-kubeconfig" --evidence "$RUNNER_TEMP/x05-evidence"
      - name: Print reproducible evidence
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/x05-evidence" ]]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/x05-evidence.tar.gz" x05-evidence
            sha256sum "$RUNNER_TEMP/x05-evidence.tar.gz"
            echo X05_EVIDENCE_BEGIN
            base64 -w 96 "$RUNNER_TEMP/x05-evidence.tar.gz"
            echo X05_EVIDENCE_END
          fi
      - name: Remove the dedicated cluster
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/kind-x05" ]]; then
            systemd-run --user --scope --quiet -p Delegate=yes "$RUNNER_TEMP/kind-x05" delete cluster \
              --name ieo-x05 --kubeconfig "$RUNNER_TEMP/x05-kubeconfig"
          fi
