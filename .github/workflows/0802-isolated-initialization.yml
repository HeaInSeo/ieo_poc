name: 08-02 isolated initialization

on:
  push:
    branches: [task/0802-cluster-baseline]

permissions:
  contents: read

concurrency:
  group: 0802-isolated-initialization
  cancel-in-progress: false

jobs:
  isolated-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch fixed kind and kubectl tools
        run: |
          bin="$RUNNER_TEMP/0802-bin"
          mkdir "$bin"
          curl -fsSL --retry 3 -o "$bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64
          printf '%s  %s\n' eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa "$bin/kind" | sha256sum -c
          url=https://dl.k8s.io/release/v1.35.0/bin/linux/amd64
          curl -fsSL --retry 3 -o "$bin/kubectl" "$url/kubectl"
          curl -fsSL --retry 3 -o "$bin/kubectl.sha256" "$url/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$bin/kubectl.sha256")" "$bin/kubectl" | sha256sum -c
          chmod 0755 "$bin/kind" "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Initialize and verify the fixture, then delete its nodes
        run: bash probes/0802-cluster-baseline/run-lab.sh "$RUNNER_TEMP/0802-lab"
      - name: Preserve check evidence
        if: always()
        run: |
          dir="$RUNNER_TEMP/0802-lab"
          if [[ -d "$dir/evidence" ]]; then
            tar -C "$dir" -czf "$RUNNER_TEMP/0802-evidence.tar.gz" evidence
            sha256sum "$RUNNER_TEMP/0802-evidence.tar.gz"
            echo 0802_EVIDENCE_BEGIN
            base64 -w 96 "$RUNNER_TEMP/0802-evidence.tar.gz"
            echo 0802_EVIDENCE_END
          fi
