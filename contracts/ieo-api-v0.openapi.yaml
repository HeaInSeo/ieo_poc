openapi: 3.1.0
info:
  title: ieo coordinator API v0
  version: 0.11.0
  summary: Registration, state and event read model for the Console Coordinator PoC (task 01-08)
  description: |
    Contract bound in task 01-08 (plan v1.3.3 §1.4–§1.6, contract_revision 4); implemented in 02-03/02-05/02-07.
    0.6.0 (02-03, additive): health, semantic review, coordinator assignment/evidence/verdict/outbox endpoints,
    their codes, and the judgment policy pin (contracts/judgment-policy-v0.json, freeze item L07).
    0.11.0 (02-05 step 3, additive): deliverAssignment (`POST /v0/repos/{repo_id}/roles/{role}/deliveries`,
    `roles:control`, `Idempotency-Key`; HTTP only): the coordinator records the request, judges resumption
    (`compare`), runs the shared budget check, calls the role supervisor's start or reconnect with the coordinator
    record and limits it builds from its database, and records the answer — or `unknown` when it was lost; the same
    key again re-queries without starting anything. getOwnAssignment answers `last_delivery_id` and the new
    `expected_runtime` (image and profile of that delivery). Rejection code `ATTEMPT_ID_CONFLICT`. No existing
    operation's behaviour changes.
    0.10.0 (02-05 step 2, additive): three role-supervisor operations under the supervisor's own `checkpoint:report`
    credential of one (repo, role) (PLAN T1: only the supervisor holds coordinator credentials, no new scope):
    getOwnAssignment (`GET /v0/repos/{repo_id}/roles/{role}/assignment`), recordFirstAction
    (`POST …/first-actions`, key (assignment_id, generation, attempt_id)) and reportSessionStatus
    (`POST …/session-status`, `Idempotency-Key`). Their records are claims, never completion signals. The same
    operations are RPCs of `ieo.internal.v0.SupervisorService` (contracts/ieo-internal-v0.md). Problem code
    `NO_CURRENT_ASSIGNMENT` (404 of getOwnAssignment). No existing operation changes.
    0.9.0 (02-05, in progress; step 1 U2/C2): registerSprint states its full check order (sprint repo → 01-07 →
    import ownership → import gate → store). The import ownership and gate checks now follow the 01-07 checks and
    still apply to every outcome those accept (201, 200 `ALREADY_REGISTERED`, 200 `SUPERSEDED`): the set of refused
    requests is unchanged, only the first code of a request that fails more than one check changes (listed in
    registerSprint). New refusal (C2): a sprint_id that a repo binding names is reserved for that repo before its
    first registration (409 `SPRINT_REPO_CONFLICT` for any other repo); the coordinator refuses to start when a
    binding names a sprint_id that another repo registered, or that two bindings name. No new code or field.
    0.8.0 (X-01 follow-up C2): imports need the service-only scope `notion:import` and record queue gates apart from
    missing facts; executable registration and assignment of an imported sprint are gated by those server records
    (`IMPORT_GATED`, `IMPORT_INCOMPLETE`); user-approved exceptions (`POST /v0/coordinator/exceptions`).
    0.7.0 (X-01): Notion task import as a draft sprint (`POST /v0/imports/notion`, additive); behaviour change in
    issueAssignment: a running assignment's next generation may stay on its revision (pin); registerSprint for a
    sprint created by a Notion import accepts only a spec derived from its latest import.
    0.5.0 (L08, not backward compatible with 0.4.0 clients): RegistrationResult state SUPERSEDED + superseded_by,
    codes REVISION_SUPERSEDED and ASSIGNMENT_SHA_MISMATCH, required ClaimReceipt disposition fields.
    - Registration acceptance is intake for semantic review, not execution intake or completion.
    - Every non-2xx response leaves server state unchanged (0 state transitions, 0 events).
    - `coordinator_to_client` data is `verified`; agent submissions are stored as `claim` only.
    - The CLI test client uses only these endpoints. No UI is built in the PoC.
    - Check order: 401 (credential) → 403/409 (scope, role, current assignment) → 400 (format) → 409 (identity) → 422 (reference/binding).
    - Agent credentials carry only agent scopes, each bound to one (repo, role): `agent:report`, `agent:repro`
      (guardrail only) and the role supervisor's `checkpoint:report`. `checkpoint:report` is the supervisor scope of
      that (repo, role): its checkpoints (report, latest), its own assignment, the first action of its attempts and
      its session status. Only the supervisor process holds it, never the model process (runtime contract §4.3;
      a same-UID process can still read it, so what it records is a claim). Every `/v0/sprints*` endpoint answers
      403 `AGENT_READ_DENIED` to agent credentials.
servers:
  - url: http://127.0.0.1:8080
    description: PoC local (same-host phase); real binding decided in 01-04
security:
  - bearer: []
tags:
  - name: sprints
  - name: agent
  - name: coordinator
paths:
  /v0/sprints:
    post:
      tags: [sprints]
      operationId: registerSprint
      summary: Register a SprintSpec v0 revision
      description: |
        Required scope `sprints:register` for `target.repo_id`. Check order (02-05 U2), after the credential, scope,
        `target.repo_id`, repo scope, Idempotency-Key and `mode` checks:
        (1) idempotent replay (same key, body and mode → 200 stored result);
        (2) the sprint's repo: a sprint_id registered for another repo (RG2) or reserved by another repo's binding
        (C2) → 409 `SPRINT_REPO_CONFLICT`, checked before the format, so a malformed body that names such a sprint_id
        is 409, not 400;
        (3) the 01-07 checks: format (400) → digest → revision identity (409 `REVISION_CONFLICT`,
        `REVISION_SUPERSEDED`) → references → binding for `mode=executable` (422 `UNBOUND_DRAFT`); one answer
        carries every 01-07 rejection, its status is the first of 400, 409, 422 present;
        (4) import ownership (409 `EVENT_CONTENT_CONFLICT`, below);
        (5) import gate for `mode=executable` (409 `IMPORT_INCOMPLETE`, then `IMPORT_GATED`, below);
        (6) store (201), or the stored-result lookup (200 `ALREADY_REGISTERED` / `SUPERSEDED`, no write).
        (4) and (5) apply to every outcome step (3) does not reject — a new revision, `ALREADY_REGISTERED` and
        `SUPERSEDED` alike — so an unchanged re-submission is refused whenever its new submission would be.
        Before 0.9.0, (4) and (5) ran before (2)–(3) for well-formed bodies. The refused requests are the same;
        the first code changed only for requests that fail more than one check:
        imported sprint, not derived from its latest import, revision below the latest → was
        `EVENT_CONTENT_CONFLICT`, now `REVISION_SUPERSEDED`; same, revision stored with another digest → was
        `EVENT_CONTENT_CONFLICT`, now `REVISION_CONFLICT`; same, with a digest or reference error → was
        `EVENT_CONTENT_CONFLICT`, now that 01-07 code (e.g. 422 `DIGEST_MISMATCH`, `UNDEFINED_PREREQUISITE`); same,
        `mode=executable` with an unmet binding (e.g. a draft-state spec) → was `EVENT_CONTENT_CONFLICT`, now 422
        `UNBOUND_DRAFT`; executable spec caught by the import gate that also has a 01-07 error (including a stored
        imported draft re-sent with `mode=executable`) → was `IMPORT_GATED` / `IMPORT_INCOMPLETE`, now the 01-07 code;
        executable spec caught by the import gate whose sprint_id belongs to or is reserved for another repo → was
        `IMPORT_GATED` / `IMPORT_INCOMPLETE`, now `SPRINT_REPO_CONFLICT`.
        The idempotent request identity is (Idempotency-Key, body digest, mode). Same key + same body
        + same mode → 200 with the stored result. Same key with a different body **or a different mode**
        → 409 `IDEMPOTENCY_KEY_CONFLICT` (a draft registration is never replayed as executable intake).
        Without an idempotent replay, a revision already stored in draft mode and now submitted with
        `mode=executable` goes through the binding check again (01-07 rule).
        A sprint_id belongs to the repo of its first registered revision: a revision whose `target.repo_id`
        differs → 409 `SPRINT_REPO_CONFLICT` (policy RG2). A sprint_id that a repo binding names (`--bindings`,
        01-07 §3) belongs to that repo from the start (02-05 C2): another repo's registration → 409
        `SPRINT_REPO_CONFLICT`, also before the first registration. A sprint_id no binding names keeps the
        first-registration rule (its existence stays observable as 409 versus 201).
        A sprint created by a Notion import (X-01) accepts only a spec derived from its latest import (same tasks and
        `notion_page` source digest); other content → 409 `EVENT_CONTENT_CONFLICT`. With `mode=executable` the
        server's import records decide (C2): missing facts → 409 `IMPORT_INCOMPLETE`; unreleased queue gates without a
        user-approved exception → 409 `IMPORT_GATED`. Text in the spec (e.g. removed reasons) does not decide.
        The gate applies to every executable spec whose sources name an imported Notion page id in any field (any
        `kind`, any digest; dashed or plain), and to every imported page whose content digest a source cites unless the
        latest import of a page that source names carries that digest: a copy under another sprint_id is gated, also when
        its reference is rewritten to another imported page, and the exception covers only the import's own test
        sprint and page. "Latest import" means the highest revision (assigned under the registry lock, so independent
        of the clock), then import time, for every check. A cited page with imports under more than one
        test id (possible only in data from before that was refused) is refused (409 `IMPORT_GATED`). A copy whose sources cite neither the gated page's id nor its imported content
        digest (both dropped, or both rewritten, including to another imported page's id and digest) cannot be
        recognised by the server and rests on the registrar and the semantic review.
        Only the latest registered revision of a sprint is active (01-07 rev 3). After a newer revision
        exists, a new registration of an older revision (any mode) and an executable promotion of an
        older revision stored as draft → 409 `REVISION_SUPERSEDED`. An identical re-submission of an older
        revision in a mode it already covers → 200 `SUPERSEDED` with `superseded_by`: a historical lookup
        of the stored result that changes no state and never reactivates the old revision.
        An Idempotency-Key replay returns the stored request's result re-evaluated against the current
        registry: if a newer revision is now active, `state=SUPERSEDED` with `superseded_by` (never the
        original ACCEPTED/ALREADY_REGISTERED), and no state changes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [draft, executable], default: draft }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../docs/poc/SprintSpec_v0.schema.json' }
      responses:
        '201':
          description: Accepted for semantic review (P01). Not execution intake.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResult' }
        '200':
          description: Same sprint_id/revision/digest (or same Idempotency-Key + body) already registered. `state=SUPERSEDED` when a newer revision is active (historical lookup, no state change).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/sprint-inputs:
    post:
      tags: [sprints]
      operationId: convertHumanInput
      summary: Convert a human sprint input to a SprintSpec v0 draft on the server and register it as draft
      description: |
        Required scope `sprints:register` for the input's repo. The server applies the repo's approved
        binding (sprint number, delegation, sources, profile, limits); the user never supplies them
        (01-07 §3). The converted spec goes through steps (2), (3) and (6) of registerSprint (its sprint_id is the
        binding's own, reserved for this repo; it is never an imported sprint). Response carries the conversion record (name↔ID map, generated fields, preserved
        unrepresented fields, semantic-review list, unresolved bindings) and the draft registration result.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../docs/poc/HumanSprintInput_v0.schema.json' }
      responses:
        '201':
          description: Converted and registered as draft (semantic review pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResult' }
        '200':
          description: Idempotent replay (same key, same body)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversionResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/imports/notion:
    post:
      tags: [sprints]
      operationId: importNotionTask
      summary: Register a task read from Notion as a draft sprint under a separate test ID (X-01)
      description: |
        Required scope `notion:import` (service principals only) for `input.repo` (agents → 403
        `AGENT_READ_DENIED`); a registrar with `sprints:register` cannot write import records (C2). The importer
        (`ieo-notion`) reads one Notion page, derives a HumanSprintInput v0 and sends the source identity
        (page id, URL, last edit time, SHA-256 content digest, original task ID) and the reasons the task is
        not executable (`unresolved`). The server applies the repo's approved binding, uses `test_id` as the
        sprint ID (distinct from the Notion task ID), adds the page as a `notion_page` source and the reasons
        as unresolved bindings, and registers the result as **draft** through the 01-07 checks. A spec with
        any unresolved reason or unbound limits can never be registered executable or assigned.
        Same (page, content digest) → 200 replay with `replay=true` and no state change (re-evaluated:
        `SUPERSEDED` once a newer revision exists). Changed content → the next revision of the test sprint;
        earlier revisions stay stored. The same content under another `test_id`, or another page under an
        existing `test_id` → 409 `EVENT_CONTENT_CONFLICT`. A replay is answered only for the repo of the earlier
        import (another repo → 409 without stored content). A `test_id` that names an existing sprint not created
        by a Notion import → 409 `EVENT_CONTENT_CONFLICT`; a `test_id` equal to the Notion task ID → 400.
        A replay is only the page's latest import: content that returns to an earlier digest (A→B→A) is a new
        revision, so the gates it records apply again. A page belongs to one test_id.
        A `test_id` may not be a binding's `sprint_id` (reserved for human input conversion, so `convertHumanInput`
        never writes an imported sprint). `registerSprint` for an imported sprint accepts only a spec derived from its
        latest import (same tasks and the same `notion_page` source digest) — the way to bind limits and make it
        executable; other content → 409 `EVENT_CONTENT_CONFLICT`. That ownership check follows the sprint repo
        rule and the 01-07 checks (registerSprint check order, 0.9.0): format errors stay 400, another repo
        `SPRINT_REPO_CONFLICT`, revision and reference errors keep their 01-07 code; it applies to every outcome the
        01-07 checks accept, so an earlier import's stored revision re-sent unchanged is 409, not 200. A new test sprint takes the first number of the
        binding's `import_sprint_numbers` that no registered task uses; none free → 422 `UNBOUND_DRAFT`.
        Nothing is written to Notion. An assignment already running keeps its revision; only its own next
        generation may continue on that revision after a newer one is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [test_id, source, input]
              properties:
                test_id: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
                source:
                  type: object
                  additionalProperties: false
                  required: [system, page_id, url, last_edited_time, content_digest, source_task_id, fetched_via]
                  properties:
                    system: { const: notion }
                    page_id: { type: string, pattern: '^[0-9a-f]{32}$', description: canonical Notion page id (32 lowercase hex, no dashes) }
                    url: { type: string, minLength: 1 }
                    last_edited_time: { type: string, minLength: 1 }
                    content_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
                    source_task_id: { type: string, minLength: 1 }
                    fetched_via: { type: string, minLength: 1 }
                    observed_at: { type: [string, 'null'] }
                input: { $ref: '../docs/poc/HumanSprintInput_v0.schema.json' }
                unresolved:
                  description: Missing facts. They always block execution; an exception never lifts them.
                  type: array
                  items: { type: string, minLength: 1 }
                gates:
                  description: |
                    Queue gates the page records (section, state, blocking target). Stored with the import; while the
                    latest import of the test sprint records gates, executable registration and assignment answer
                    409 `IMPORT_GATED` unless a user-approved exception exists for exactly this (test_id, repo). A later
                    import that records no gates is the release record.
                  type: array
                  items: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/CoordinatorResult' }
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/coordinator/exceptions:
    post:
      tags: [coordinator]
      operationId: recordExecutionException
      summary: A person approves a PoC execution exception for one imported test sprint (X-01 C2)
      description: |
        Required scope `exceptions:approve`, held by user principals only, for `repo_id`. The exception lifts the queue
        gates recorded by the import service for exactly this (test_id, repo) and the page and content digest of that
        test sprint's latest import at approval time (`approved_page_id`, `approved_content_digest`; a later, different
        gated import needs a new approval), and nothing
        else; its `scope` (branch, base SHA, no merge/deploy) is stored as a record, not enforced by the server. Missing facts
        (`IMPORT_INCOMPLETE`), binding, semantic review, limits and every other check still apply. It is a separate
        record; the imported gates stay stored. `exception_id` is the idempotency key. Unknown imported test sprint in
        this repo → 422 `UNKNOWN_TASK`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [exception_id, test_id, repo_id, lifts, scope, decision_ref]
              properties:
                exception_id: { type: string, minLength: 1 }
                test_id: { type: string, minLength: 1 }
                repo_id: { type: string, minLength: 1 }
                lifts: { const: queue_gates }
                scope: { type: object }
                decision_ref: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/CoordinatorResult' }
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/sprints/{sprint_id}/revisions/{revision}:
    get:
      tags: [sprints]
      operationId: getSprintRevision
      summary: Read an immutable registered revision with its digest and review/intake state
      description: Required scope `sprints:read` for the sprint's repo.
      parameters:
        - $ref: '#/components/parameters/SprintId'
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Registered revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [spec, digest, registration_state, review_state, registered_at]
                properties:
                  spec: { $ref: '../docs/poc/SprintSpec_v0.schema.json' }
                  digest: { type: string, pattern: '^[a-f0-9]{64}$' }
                  registration_state: { type: string, enum: [draft, ready] }
                  review_state: { type: string, enum: [pending_semantic_review, semantic_review_passed, semantic_review_rejected] }
                  registered_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v0/sprints/{sprint_id}/state:
    get:
      tags: [sprints]
      operationId: getSprintState
      summary: Current verified state rebuilt from events; agent claims in a separate field
      description: Required scope `sprints:read`. Reading never creates events or notifications.
      parameters:
        - $ref: '#/components/parameters/SprintId'
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v0/sprints/{sprint_id}/events:
    get:
      tags: [sprints]
      operationId: listSprintEvents
      summary: Ordered event page (event_id + event_revision), cursor-based
      description: |
        Required scope `sprints:read`. Events are append-only in server commit order. A cursor is an opaque
        position; a page holds the events committed after it, up to `limit`. `next_cursor` is always the
        position after the last returned event (or the input position when the page is empty), so a client
        can poll the end of the stream. Events already returned for a cursor never change or disappear;
        a page that was not full may gain newly committed events on a later read. Reads never create
        events, notifications or state transitions.
      parameters:
        - $ref: '#/components/parameters/SprintId'
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Event page
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, next_cursor, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: '../docs/poc/ProgressReport_v0.schema.json' }
                  next_cursor: { type: string, minLength: 1 }
                  has_more: { type: boolean }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v0/agent/reports:
    post:
      tags: [agent]
      operationId: submitAgentReport
      summary: Agent progress/checkpoint/review claim (role credential only)
      description: |
        Required scope `agent:report` bound to exactly one (repo_id, role) by the credential.
        Accepted only with `channel=agent_to_coordinator`, `evidence_level=claim`,
        `actor.role` equal to the credential's role, and `report_type` allowed for that role
        (development → development_progress, guardrail → guardrail_review).
        `verified`, `coordinator_verdict` and `decision_request` from an agent credential → 403, state unchanged.
        `(event_id, event_revision)`, scoped to the credential's (repo_id, role), is the idempotency key and
        is checked first: same content → 200 with the stored receipt (a re-query; no state change even if the
        assignment has moved on; `counts_for_current_judgment` is re-evaluated at response time and is false
        once that assignment/generation is no longer current), different content → 409 `EVENT_CONTENT_CONFLICT`.
        IDs of other (repo, role) scopes are never consulted, so their existence is not revealed.
        If the body carries `body.target_sha`, it must equal the SHA the coordinator recorded for the named
        assignment (current or earlier), else 409 `ASSIGNMENT_SHA_MISMATCH`; a claim never carries two SHAs.
        A new claim whose `assignment_id`/`generation` is the coordinator's current assignment for that
        (repo, role) → 202 `disposition=current`. A new claim for an assignment/generation the coordinator
        legitimately issued earlier to the same (repo, role) → 202 `disposition=preserved_late`: stored
        attributed to that assignment and the SHA recorded for it in the coordinator DB, excluded from the
        current judgment, and the old assignment is not reactivated (§1.9). A claim naming an assignment
        never issued to this (repo, role) → 409 `STALE_ASSIGNMENT`, state unchanged.
        A stored claim is never a completion verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../docs/poc/ProgressReport_v0.schema.json' }
      responses:
        '202':
          description: Claim stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimReceipt' }
        '200':
          description: Same event_id/event_revision and same content already stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimReceipt' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/agent/repro-requests:
    post:
      tags: [agent]
      operationId: submitReproRequest
      summary: Guardrail asks the coordinator to run a reproduction on an isolated runner
      description: |
        Required scope `agent:repro` bound to (repo_id, role=guardrail). Development credentials → 403.
        `request_id` is checked first: an identical re-submission → 200 with the stored status (a re-query;
        never re-queued, even after the assignment moved on); different content → 409 `EVENT_CONTENT_CONFLICT`.
        A new request must name the current `assignment_id`/`generation` and that assignment's `target_sha`
        (from the coordinator DB), else 409 `STALE_ASSIGNMENT`: a new stale request would start new work.
        The coordinator runs the bundle on a coordinator-owned, credential-less, single-use runner at
        `target_sha` (network blocked by default, time/resource caps) and returns raw logs to the
        Guardrail input location (01-02 contract §2.1). `request_id` is the idempotency key.
        A finished run is evidence for the Guardrail's claim, not a verdict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReproRequest' }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReproStatus' }
        '200':
          description: Same request_id and content already queued or finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReproStatus' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/agent/repro-requests/{request_id}:
    get:
      tags: [agent]
      operationId: getReproRequest
      summary: Status and raw-log references of a reproduction run
      description: Only a Guardrail credential of the request's repo; any other credential → 403 (unknown ids also 404 only after this check).
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReproStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v0/repos/{repo_id}/roles:
    get:
      tags: [coordinator]
      operationId: getRepoRoles
      summary: Status of both role supervisors of a repo (runtime contract §7)
      description: |
        Required scope `roles:control` for `repo_id`; agent credentials are refused. Each role is
        reported separately: `{reachable, status}` or `{reachable: false, error}` or the
        supervisor's own HTTP status. Adapter tokens are read per call and never returned.
        `quota_groups` (runtime contract §13 item 9): `groups[]` per `quota_group_id` with
        `roles`, `provider_status_or_unknown` (`usage_limit` if any member reports it, else
        `available` if any member observed it, else `unknown`), `affected_roles` (every member
        under `usage_limit`), `auth_or_billing_roles` (not spread to the group) and
        `member_status`; `mismatches[]` lists roles whose reported group differs from the
        `quota_group_id` configured for them in `--roles` (or that report none).
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Both roles' reports
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, roles, quota_groups]
                properties:
                  repo_id: { type: string }
                  roles: { type: object }
                  quota_groups:
                    type: object
                    required: [groups, mismatches]
                    properties:
                      groups: { type: array, items: { type: object } }
                      mismatches: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No role supervisors configured for this repo
  /v0/repos/{repo_id}/stop:
    post:
      tags: [coordinator]
      operationId: stopRepo
      summary: Repo-scope stop (runtime contract §7)
      description: |
        Required scope `roles:control` for `repo_id`. Sends a role-scope `stop` to each role
        supervisor (never one role through the other), waits up to 30 s for each to run nothing,
        and returns each role's safe-shutdown report. `safe_shutdown_confirmed` is true only when
        every role answered, runs nothing, has its checkpoint saved and reported to the
        coordinator (`checkpoint_reported: true`; false, missing or `local_only` is not
        reported), and reports no active children and no pending external requests; otherwise
        `unconfirmed` lists the reasons
        (the supervisors report children and external requests as `not_tracked`, so it is
        unconfirmed until they track them).
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Each role's stop result and safe-shutdown report
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, roles, safe_shutdown_confirmed, unconfirmed]
                properties:
                  repo_id: { type: string }
                  roles: { type: object }
                  safe_shutdown_confirmed: { type: boolean }
                  unconfirmed: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No role supervisors configured for this repo
  /v0/repos/{repo_id}/roles/{role}/checkpoints:
    post:
      tags: [coordinator]
      operationId: reportCheckpoint
      summary: A role supervisor reports a checkpoint (runtime contract §2.1, §5-1, §5-6)
      description: |
        Credential: kind `agent` with scope `checkpoint:report`, bound to this repo and role (the
        supervisor's report credential, not the model's). Body `{seq, checkpoint_json}`: the
        sequence number and the exact checkpoint file. The coordinator computes the SHA-256 over
        those bytes and stores the next checkpoint of the sequence linked to the current
        assignment: `assignment_id`/`generation` must be the current head of (repo, role) — an
        older generation → 409 `STALE_ASSIGNMENT`, another assignment → 409 `CHECKPOINT_MISMATCH`,
        none → 409 `NO_CURRENT_ASSIGNMENT` — and its sprint revision (`CHECKPOINT_MISMATCH`),
        spec digest (`DIGEST_MISMATCH`) and target SHA (`ASSIGNMENT_SHA_MISMATCH`) must match
        that assignment. The same sequence with the same bytes → 200 duplicate (nothing changes);
        other bytes → 409 `EVENT_CONTENT_CONFLICT`; a sequence past the next → 409
        `CHECKPOINT_SEQUENCE_GAP`; a checkpoint naming another repo/role → 409 `REPO_MISMATCH`.
        One exception to "current head": an `after_run`/`error` checkpoint that continues the
        stored `takeover` of the same session, assignment and generation is stored with
        `current_assignment: false` when the assignment moved on during the run (a takeover must
        always be current). A `config_tamper_detected` object in the checkpoint is recorded once
        per new session. Refused reports leave no row. An unknown role → 404 `NOT_FOUND`.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seq, checkpoint_json]
              properties:
                seq: { type: integer, minimum: 1 }
                checkpoint_json: { type: string, minLength: 1 }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [stored, seq, checkpoint_sha256, tamper_recorded, current_assignment]
                properties:
                  current_assignment: { type: boolean }
                  stored: { type: boolean }
                  seq: { type: integer }
                  checkpoint_sha256: { type: string }
                  tamper_recorded: { type: boolean }
        '200':
          description: Duplicate of the stored checkpoint of this sequence
          content:
            application/json:
              schema:
                type: object
                required: [duplicate, seq, checkpoint_sha256, tamper_recorded]
                properties:
                  duplicate: { type: boolean }
                  seq: { type: integer }
                  checkpoint_sha256: { type: string }
                  tamper_recorded:
                    type: boolean
                    description: The stored report of this sequence recorded a tamper event
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown role (`NOT_FOUND`)
        '409': { $ref: '#/components/responses/Rejected' }
  /v0/repos/{repo_id}/roles/{role}/checkpoints/latest:
    get:
      tags: [coordinator]
      operationId: latestCheckpoint
      summary: The coordinator's latest checkpoint record of one role
      description: |
        The reporting supervisor itself (`checkpoint:report` for this repo and role) or a
        `roles:control` client of the repo. 404 `NO_CHECKPOINT` when none is recorded.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
      responses:
        '200':
          description: Latest record (sequence, digest, phase, session, assignment, generation, current_assignment, sprint revision, digests, target SHA, tamper event count, and `tamper_recorded` — whether this checkpoint's own report recorded a tamper event)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No checkpoint recorded (`NO_CHECKPOINT`) or no such role
  /v0/repos/{repo_id}/roles/{role}/checkpoints/compare:
    get:
      tags: [coordinator]
      operationId: compareCheckpoint
      summary: Resume judgment for one role from the central record (runtime contract §5-2)
      description: |
        Scope `roles:control` for the repo. Reads the supervisor's status and compares its local
        checkpoint (sequence, SHA-256) with the central record, and the central record with the
        current assignment. `decision`: `resume_allowed`, `no_checkpoint`, `already_running`,
        `stale_generation`, `external_reconciliation_required` or `not_observed`, with `reasons`.
        `stale_generation` is an older generation of the same assignment whose last run finished
        (`after_run`); one whose last run did not finish is `external_reconciliation_required`
        (0.11.0, 02-05 step 3 review c11e734 M-1).
        Read-only. The supervisor is asked before the database reads, which run under the same
        lock as the reports. An unknown role → 404 `NOT_FOUND`.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
      responses:
        '200':
          description: Judgment
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, role, decision, reasons]
                properties:
                  repo_id: { type: string }
                  role: { type: string }
                  decision: { type: string, enum: [resume_allowed, no_checkpoint, already_running, stale_generation, external_reconciliation_required, not_observed] }
                  reasons: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown role (`NOT_FOUND`)
  /v0/repos/{repo_id}/roles/{role}/assignment:
    get:
      tags: [agent]
      operationId: getOwnAssignment
      summary: The role supervisor reads its own current assignment (02-05 step 2)
      description: |
        Credential: kind `agent` with scope `checkpoint:report`, bound to this repo and role (the
        supervisor's credential, not the model's). Other credentials → 403 (`SCOPE_DENIED` without the
        scope, `REPO_SCOPE_DENIED` for another repo, `ROLE_MISMATCH` for the other role). Read only.
        Answers the current head of (repo, role) as the coordinator recorded it: assignment, generation,
        task, target SHA, sprint revision, its spec digest and `sources[]`, the revision's `limits`,
        `attempts_issued` for (sprint, task, role), the policy digest and issue time. Elapsed time and
        token consumption are not metered by the coordinator yet (02-05 step 5). `last_delivery_id` is the
        newest deliverAssignment of this head (null without one) and `expected_runtime` the image digest and
        profile it expects the role to run (null without one); the supervisor refuses a start or reconnect
        whose coordinator record differs from this answer (runtime contract revision 11). No head → 404
        `NO_CURRENT_ASSIGNMENT`. An unknown
        role → 404 `NOT_FOUND`. Order: 401 → 404 role → 403 → 404 no head.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
      responses:
        '200':
          description: The current assignment
          content:
            application/json:
              schema:
                type: object
                required: [repo_id, role, assignment_id, generation, task_id, target_sha, sprint_id, sprint_revision,
                           spec_digest, sources, limits, attempts_issued, policy_digest, issued_at, last_delivery_id,
                           expected_runtime]
                properties:
                  repo_id: { type: string }
                  role: { type: string, enum: [development, guardrail] }
                  assignment_id: { type: string }
                  generation: { type: integer, minimum: 0 }
                  task_id: { type: string }
                  target_sha: { type: string }
                  sprint_id: { type: string }
                  sprint_revision: { type: integer, minimum: 1 }
                  spec_digest: { type: string }
                  sources:
                    description: The revision's SprintSpec v0 `sources[]`, unchanged
                    type: array
                    items:
                      type: object
                      required: [kind, ref, revision, digest, observed_at]
                      properties:
                        kind: { type: string }
                        ref: { type: string }
                        revision: { type: string }
                        digest: { type: string }
                        observed_at: { type: [string, 'null'] }
                  limits:
                    description: The revision's limits (null where unbound)
                    type: object
                    required: [elapsed_seconds, total_tokens, correction_attempts]
                    properties:
                      elapsed_seconds: { type: [integer, 'null'] }
                      total_tokens: { type: [integer, 'null'] }
                      correction_attempts: { type: [integer, 'null'] }
                  attempts_issued: { type: integer, minimum: 0 }
                  policy_digest: { type: string }
                  issued_at: { type: string, format: date-time }
                  last_delivery_id: { type: [string, 'null'] }
                  expected_runtime:
                    description: Image and profile of the newest delivery of this head (02-05 step 3)
                    oneOf:
                      - type: 'null'
                      - type: object
                        required: [image_digest, profile_id, profile_revision]
                        properties:
                          image_digest: { type: string }
                          profile_id: { type: string }
                          profile_revision: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No current assignment (`NO_CURRENT_ASSIGNMENT`) or unknown role (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/Internal' }
  /v0/repos/{repo_id}/roles/{role}/deliveries:
    post:
      tags: [coordinator]
      operationId: deliverAssignment
      summary: Deliver the current assignment to the role supervisor (02-05 step 3; HTTP only)
      description: |
        Scope `roles:control` for the repo (service or user credential; never an agent credential). There is
        no gRPC form: the internal gRPC API serves supervisor operations only (contracts/ieo-internal-v0.md
        §1.2). `Idempotency-Key` (8–128 bytes) is the delivery's request id within (repo, role).
        Shape: (1) the request is recorded (`verified`, transaction 1) when `assignment_id`/`generation` are the
        current head (else 409 `STALE_ASSIGNMENT`; no head → 404 `NO_CURRENT_ASSIGNMENT`; an `attempt_id` used
        by another delivery → 409 `ATTEMPT_ID_CONFLICT`); (2) the resume judgment of compareCheckpoint:
        `no_checkpoint` → `start`, `resume_allowed` → `reconnect` (`new_session: true` asks for `start` on
        `resume_allowed`, and on `stale_generation` only when that older generation's last run finished
        (`after_run`); an older generation whose last run did not finish is judged
        `external_reconciliation_required`); `already_running`, `external_reconciliation_required`,
        `not_observed` and `stale_generation` without `new_session` call nothing (`outcome: not_called`).
        The judgment is made again once the budget check holds the ledger lock; if it changed, nothing is
        called (`not_called`, first reason says so);
        (3) the shared budget check outside the role containers — the same code as the 02-04 host caller: the
        ledger read fail-closed, a record that asks for a person, an unmeasured run, the no-extra-billing
        observation, the budget and role-share limits, every service idle with its runs known; a refusal calls
        nothing (`outcome: budget_refused`); (4) the supervisor's start or reconnect, outside any transaction,
        with the coordinator record (assignment, generation, sprint revision, spec digest, image, profile), the
        target SHA and the limits the coordinator builds from its database and configuration — never from the
        request; the run's limits are also bounded by the revision's `elapsed_seconds` and `total_tokens`;
        (5) the answer is recorded (transaction 2): `accepted` (202), `refused` (any other answer of the
        supervisor: a 4xx/5xx refusal, or a 200 `replayed` stored answer of the same attempt accepted earlier
        by another caller — nothing was started by this delivery), or
        `unknown` when the answer was lost (the budget ledger then asks for a person, as for the host caller).
        An accepted run is finished, measured and charged in the background by the same library.
        The same key with the same body answers the stored delivery (200). A delivery with no result yet that
        was requested less than 120 s ago is still in flight: 409 `DELIVERY_IN_PROGRESS`, nothing recorded.
        A stored `unknown` (or a result still missing after that) is re-queried first: the supervisor's stored answer for the attempt (`GET /v0/role/attempts/{id}`,
        which never starts a run) is recorded as the next result (`accepted`, `not_accepted`, or `unknown`
        again; `accepted` only when the stored answer's request digest equals what this delivery sent, and a
        re-query result is not recorded if another result was recorded meanwhile). The same key with another
        body → 409 `IDEMPOTENCY_KEY_CONFLICT`. The budget plan must name exactly the roles configured for the
        repo (else `budget_refused`). A delivery is not a takeover:
        the takeover is the supervisor's checkpoint report (02-05 step 4). `logical_name` (default
        `<repo>-<role>`) is kept in the mapping record only; a reconnect resumes by the checkpoint's session id
        (runtime contract §4.2, §10 item 5). Order: 401 → 404 role → 403 → 400 Idempotency-Key → 400 body →
        404 no role configuration → transaction 1 → judgment → budget → supervisor → transaction 2.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, generation, attempt_id, session_id, prompt]
              properties:
                assignment_id: { type: string, minLength: 1, maxLength: 128 }
                generation: { type: integer, minimum: 0 }
                attempt_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$' }
                session_id:
                  description: The new session's id for a start (also the new id when a reconnect detects a tamper); never a resume key
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
                prompt: { type: string, minLength: 1, maxLength: 65536 }
                logical_name: { type: string, minLength: 1, maxLength: 128 }
                new_session: { type: boolean, default: false }
      responses:
        '201':
          description: The delivery recorded with its first result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '200':
          description: The stored delivery (same key and body); a stored `unknown` was re-queried first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '400':
          description: Missing Idempotency-Key or a body that is not the schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RejectionList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown role, no role configuration (`NOT_FOUND`) or no current assignment (`NO_CURRENT_ASSIGNMENT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: '`STALE_ASSIGNMENT`, `ATTEMPT_ID_CONFLICT`, `IDEMPOTENCY_KEY_CONFLICT` or `DELIVERY_IN_PROGRESS`; nothing recorded'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RejectionList' }
        '500': { $ref: '#/components/responses/Internal' }
  /v0/repos/{repo_id}/roles/{role}/first-actions:
    post:
      tags: [agent]
      operationId: recordFirstAction
      summary: The role supervisor records the first actual action of one attempt (02-05 step 2, claim)
      description: |
        Credential and refusals as getOwnAssignment. Body: the attempt's (assignment_id, generation,
        attempt_id), its session_id, the stream offset of the first actual action (`event_offset`), the
        supervisor's observation time (`observed_at`, RFC 3339 UTC `…Z`: stream events carry no time) and
        `kind` (`tool_use` or `text`). Stored as a claim (`evidence_level: claim`); never a completion signal
        and never an input of a verdict.
        Idempotency key: (assignment_id, generation, attempt_id) within the credential's (repo, role). The
        same body again → 200 with the stored receipt (nothing changes); another body under the key → 409
        `EVENT_CONTENT_CONFLICT`. A new record needs: the assignment issued to this (repo, role) (else 409
        `STALE_ASSIGNMENT`) and a stored `takeover` checkpoint of that session under that assignment and
        generation (else 409 `CHECKPOINT_MISMATCH`). Like the later checkpoints of a run, a first action
        recorded after the assignment moved on is kept with `current_assignment: false`.
        Order: 401 → 404 role → 403 → 400 format → 409 key → 409 assignment, takeover. Refusals leave no row.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, generation, attempt_id, session_id, event_offset, observed_at, kind]
              properties:
                assignment_id: { type: string, minLength: 1, maxLength: 128 }
                generation: { type: integer, minimum: 0 }
                attempt_id: { type: string, minLength: 1, maxLength: 128 }
                session_id: { type: string, minLength: 1, maxLength: 256 }
                event_offset: { type: integer, minimum: 0 }
                observed_at: { type: string, format: date-time, description: 'UTC, ending in Z' }
                kind: { type: string, enum: [tool_use, text] }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstActionReceipt' }
        '200':
          description: The same first action was already recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstActionReceipt' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown role (`NOT_FOUND`)
        '409': { $ref: '#/components/responses/Rejected' }
        '500': { $ref: '#/components/responses/Internal' }
  /v0/repos/{repo_id}/roles/{role}/session-status:
    post:
      tags: [agent]
      operationId: reportSessionStatus
      summary: The role supervisor reports its session status (02-05 step 2, claim)
      description: |
        Credential and refusals as getOwnAssignment. Body: the runtime contract §7 status items, every one
        present (`null` where not known): `observed_at` (RFC 3339 UTC `…Z`, the supervisor's clock),
        `lifecycle` (`idle`, `running`, `stopping`), `session_id`, `assignment_id` and `generation` (both
        or neither), `quota_group_id`, `provider_status_or_unknown`, `last_actual_action_at`,
        `checkpoint_seq` and `checkpoint_sha256` (both or neither), `pending_external_requests` and
        `active_children` (`"not_tracked"` or a list of objects; never 0 for not tracked). Appended to the
        coordinator's status history of (repo, role) as a claim, so the last report and its time stay
        visible when the supervisor cannot be reached. A status observed at or before an already stored one
        is kept with `stale_on_arrival: true` and is never read as the current value. A named assignment
        must have been issued to this (repo, role) (else 409 `STALE_ASSIGNMENT`); an earlier one is kept
        with `current_assignment: false` (null when none is named).
        Idempotency: the `Idempotency-Key` header (8–128 bytes; missing → 400 `MISSING_FIELD`) within the
        credential's (repo, role). The same status (as a JSON value) again → 200 with the stored receipt;
        another status under the key → 409 `IDEMPOTENCY_KEY_CONFLICT`.
        Order: 401 → 404 role → 403 → 400 key → 400 format → 409 key → 409 assignment. Refusals leave no row.
      parameters:
        - { name: repo_id, in: path, required: true, schema: { type: string } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [development, guardrail] } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observed_at, lifecycle, session_id, assignment_id, generation, quota_group_id,
                         provider_status_or_unknown, last_actual_action_at, checkpoint_seq, checkpoint_sha256,
                         pending_external_requests, active_children]
              properties:
                observed_at: { type: string, format: date-time, description: 'UTC, ending in Z' }
                lifecycle: { type: string, enum: [idle, running, stopping] }
                session_id: { type: [string, 'null'], minLength: 1, maxLength: 256 }
                assignment_id: { type: [string, 'null'], maxLength: 128 }
                generation: { type: [integer, 'null'], minimum: 0 }
                quota_group_id: { type: string, minLength: 1, maxLength: 128 }
                provider_status_or_unknown: { type: string, minLength: 1, maxLength: 64 }
                last_actual_action_at: { type: [string, 'null'], format: date-time }
                checkpoint_seq: { type: [integer, 'null'], minimum: 1 }
                checkpoint_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
                pending_external_requests:
                  oneOf:
                    - { type: string, const: not_tracked }
                    - { type: array, items: { type: object } }
                active_children:
                  oneOf:
                    - { type: string, const: not_tracked }
                    - { type: array, items: { type: object } }
      responses:
        '201':
          description: Appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatusReceipt' }
        '200':
          description: The same status under the same key was already stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatusReceipt' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown role (`NOT_FOUND`)
        '409': { $ref: '#/components/responses/Rejected' }
        '500': { $ref: '#/components/responses/Internal' }
  /v0/health:
    get:
      tags: [coordinator]
      operationId: getHealth
      summary: Liveness (process answers, DB reachable); not a P04 result
      security: []
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version, policy_digest, scope]
                properties:
                  status: { const: up }
                  schema_version: { type: string }
                  policy_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
                  scope: { type: string }
        '500': { $ref: '#/components/responses/Internal' }
  /v0/sprints/{sprint_id}/revisions/{revision}/semantic-review:
    post:
      tags: [sprints]
      operationId: recordSemanticReview
      summary: Independent semantic review (P01) of one registered revision
      description: |
        Required scope `review:semantic` for the sprint's repo (otherwise 404, the sprint is not revealed).
        Separate from the format/reference check that registration runs. The registrant cannot review its own
        registration — neither the registrant nor a principal that registered/promoted this revision
        (403 `SELF_REVIEW_DENIED`, policy G3). The body names the exact digest it covers (policy RG2);
        another digest → 409 `DIGEST_MISMATCH`. One decision per revision: the same decision again → 200, a different
        one → 409 `EVENT_CONTENT_CONFLICT`. A superseded revision → 409 `REVISION_SUPERSEDED`. Only a revision that is
        registered executable and has `semantic_review_passed` can be assigned.
      parameters:
        - $ref: '#/components/parameters/SprintId'
        - name: revision
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, digest]
              properties:
                decision: { type: string, enum: [passed, rejected] }
                reason: { type: string, minLength: 1 }
                digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '201': { $ref: '#/components/responses/SemanticReview' }
        '200': { $ref: '#/components/responses/SemanticReview' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Rejected' }
  /v0/coordinator/assignments:
    post:
      tags: [coordinator]
      operationId: issueAssignment
      summary: Issue an (assignment, generation) to a (repo, role); compare-and-swap on the ownership head
      description: |
        Required scope `coordinator:assign` for `repo_id` (service/user, never an agent).
        Same (assignment_id, generation) and same body → 200 `already_issued` with `is_current` (historical
        re-query, never a re-activation); different body → 409 `EVENT_CONTENT_CONFLICT`.
        The revision must exist (422 `UNKNOWN_SPRINT_REVISION`), target this repo (422 `REPO_MISMATCH`), be the
        latest (409 `REVISION_SUPERSEDED`) — except that a running assignment's next generation may stay on the
        revision its previous generation used (X-01 pin; user decision 2026-11-13); that continuation is
        bounded by the `limits.correction_attempts` of the newest revision that is executable and semantically
        reviewed (a newer draft changes nothing for the running execution), else by its own revision's — be
        registered executable (422 `UNBOUND_DRAFT`) and have passed the semantic review (422
        `SEMANTIC_REVIEW_NOT_PASSED`); the task must be in it (422 `UNKNOWN_TASK`).
        The Notion execution gate of the revision's spec (X-01 C2, same pages as registerSprint) is checked again at
        assignment: 409 `IMPORT_INCOMPLETE` when the latest import of a cited page lacks facts, 409 `IMPORT_GATED` when
        it records queue gates without a matching exception. This also stops pinned continuations after a re-gating
        import.
        `expected_current` must equal the current head of (repo, role) (null when none), else 409
        `OWNERSHIP_CONFLICT`. Generation 0 needs an unused assignment_id; generation n>0 must follow the head
        (same assignment_id, n-1, same sprint and task) — else 409 `OWNERSHIP_CONFLICT` / 422.
        Prerequisites need verified verdicts under the pinned policy, judged against a revision whose definition of
        the prerequisite task (outputs, acceptance, exit_condition, verification, requirement_ids) equals the one in
        its sprint's latest revision (409 `PREREQUISITE_UNMET`, policy G1).
        Attempts are cumulative per (sprint, task, role) across assignments and generations (policy G4); the
        ceiling is the spec's `limits.correction_attempts`. The first request past the ceiling records one
        verified `decision_request` with its outbox entry and answers 202 `limit_reached` (the head is
        unchanged). A ceiling value that was already asked → 409 `LIMIT_REACHED` with no state change; a newer
        revision that changes the ceiling (up or down) to a value not asked before records a new
        decision_request when the count exceeds it (policy G5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repo_id, role, assignment_id, generation, sprint_id, sprint_revision, task_id, target_sha, expected_current]
              properties:
                repo_id: { type: string, minLength: 1 }
                role: { type: string, enum: [development, guardrail] }
                assignment_id: { type: string, minLength: 1, maxLength: 128 }
                generation: { type: integer, minimum: 0 }
                sprint_id: { type: string, minLength: 1 }
                sprint_revision: { type: integer, minimum: 1 }
                task_id: { type: string, minLength: 1 }
                target_sha: { type: string, pattern: '^[a-f0-9]{40,64}$' }
                expected_current:
                  oneOf:
                    - type: 'null'
                    - type: object
                      additionalProperties: false
                      required: [assignment_id, generation]
                      properties:
                        assignment_id: { type: string, minLength: 1 }
                        generation: { type: integer, minimum: 0 }
      responses:
        '201': { $ref: '#/components/responses/CoordinatorResult' }
        '202': { $ref: '#/components/responses/CoordinatorResult' }
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/coordinator/evidence:
    post:
      tags: [coordinator]
      operationId: ingestEvidence
      summary: Store GitHub or execution evidence (input to verdicts, never a verdict)
      description: |
        Required scope `evidence:ingest` for `repo_id`. Kinds: `ci_run`/`main_ci` {sha, conclusion, source_ref},
        `run_record` {sha, source_ref, record = ieo-evidence record; passes only when
        `record.judgment.counts_as_success` is true, never on exit status alone}, `review` {sha, reviewer, author,
        state, source_ref}, `merge` {head_sha, merged_sha, source_ref}, `output` {sha, task_id, artifact_id, ref},
        `followups` {sha, task_id, accepted, ref}. `(repo_id, evidence_id)` is the idempotency key: same body → 200,
        different → 409 `EVENT_CONTENT_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_id, repo_id, kind]
              properties:
                evidence_id: { type: string, minLength: 1 }
                repo_id: { type: string, minLength: 1 }
                kind: { type: string, enum: [ci_run, run_record, review, merge, main_ci, output, followups] }
      responses:
        '201': { $ref: '#/components/responses/CoordinatorResult' }
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
  /v0/coordinator/judgments:
    post:
      tags: [coordinator]
      operationId: recordVerdict
      summary: Judge one task from evidence and current claims; verdict, outbox entry and judgment row commit together
      description: |
        Required scope `judge:verify` held by a service principal (policy G3). The head SHA is the target_sha the
        coordinator recorded for the current development assignment of that task (409 `NO_CURRENT_ASSIGNMENT`
        otherwise, policy G2). Inputs: CI/run evidence at the head; review inputs = the latest guardrail_review
        claim of the guardrail's *current* (assignment, generation) at judgment time for that task, plus GitHub
        reviews **at the head SHA** whose reviewer differs from the author (per reviewer the latest approved,
        changes_requested or dismissed review; a later commented review does not clear changes_requested);
        a current reject/needs_confirmation at the head blocks; the task and outputs are those of the
        revision the development assignment was issued from;
        merge evidence whose head_sha is the head; main CI at its merged SHA; required outputs only (optional
        outputs are listed as not judged, policy G7); accepted follow-ups at the merged SHA. The verdict is a
        verified `coordinator_verdict` whose `evidence_comparison` is the per-scope completion wording.
        `(repo_id, judgment_id)` is the idempotency key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [judgment_id, repo_id, sprint_id, task_id]
              properties:
                judgment_id: { type: string, minLength: 1 }
                repo_id: { type: string, minLength: 1 }
                sprint_id: { type: string, minLength: 1 }
                task_id: { type: string, minLength: 1 }
      responses:
        '201': { $ref: '#/components/responses/CoordinatorResult' }
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Rejected' }
        '422': { $ref: '#/components/responses/Rejected' }
  /v0/coordinator/outbox:
    get:
      tags: [coordinator]
      operationId: listOutbox
      summary: Outbox entries of verified reports in the caller's repos
      description: Required scope `outbox:deliver`. Reading changes nothing.
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, sent, unknown], default: pending }
      responses:
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v0/coordinator/outbox/{outbox_id}/delivery:
    post:
      tags: [coordinator]
      operationId: recordDelivery
      summary: Record the external delivery state of one outbox entry
      description: |
        Required scope `outbox:deliver`. pending → sent | unknown; unknown → sent; the same state again → 200
        unchanged; sent → unknown → 409 `OUTBOX_STATE_CONFLICT`. Delivery state is independent of task verdicts.
      parameters:
        - name: outbox_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [sent, unknown] }
      responses:
        '200': { $ref: '#/components/responses/CoordinatorResult' }
        '400': { $ref: '#/components/responses/Rejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/Internal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Rejected' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Opaque token mapped server-side to {principal, kind: user|service|agent, scopes, repo_ids, role?}.
        Names/labels inside request bodies are never trusted for authorization.
  parameters:
    SprintId:
      name: sprint_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Rejected:
      description: Rejected; no state change. Body lists every correctable problem (01-07 codes).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RejectionList' }
    Unauthenticated:
      description: Missing/invalid credential; no state change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Credential lacks the scope, repo or role (e.g. agent claiming verified); no state change.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    SemanticReview:
      description: Recorded (201) or the same decision already recorded (200)
      content:
        application/json:
          schema:
            type: object
            required: [sprint_id, revision, digest, decision]
            properties:
              sprint_id: { type: string }
              revision: { type: integer }
              digest: { type: string }
              decision: { type: string, enum: [passed, rejected] }
    CoordinatorResult:
      description: Coordinator endpoint result (outcome fields per operation description)
      content:
        application/json:
          schema: { type: object }
    Internal:
      description: Unexpected server or database failure; the transaction was rolled back.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown sprint/revision, or not visible to this principal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Delivery:
      description: A delivery (02-05 step 3, `verified`) and its newest result
      type: object
      required: [delivery_id, request_id, repo_id, role, assignment_id, generation, attempt_id, session_id,
                 logical_name, coordinator_record, target_sha, cause, requested_by, requested_at, evidence_level, result]
      properties:
        delivery_id: { type: string }
        request_id: { type: string }
        repo_id: { type: string }
        role: { type: string, enum: [development, guardrail] }
        assignment_id: { type: string }
        generation: { type: integer, minimum: 0 }
        attempt_id: { type: string }
        session_id: { type: string }
        logical_name: { type: string }
        coordinator_record:
          description: Built from the coordinator's database and role configuration
          type: object
          required: [generation, assignment_id, sprint_id, sprint_revision, spec_digest, image_digest, profile_id,
                     profile_revision, task_id, limits]
        target_sha: { type: string }
        cause: { type: string, enum: [operator] }
        requested_by: { type: string }
        requested_at: { type: string, format: date-time }
        evidence_level: { type: string, enum: [verified] }
        result:
          type: object
          required: [n, decision, reasons, op, outcome, limits, sent_sha256, supervisor, requeried, recorded_at]
          properties:
            n: { type: integer, minimum: 1 }
            decision: { type: [string, 'null'], enum: [resume_allowed, no_checkpoint, already_running, stale_generation, external_reconciliation_required, not_observed, null] }
            reasons: { type: array }
            op: { type: [string, 'null'], enum: [start, reconnect, null] }
            outcome: { type: string, enum: [not_called, budget_refused, accepted, refused, unknown, not_accepted] }
            limits: { type: [object, 'null'] }
            sent_sha256: { type: [string, 'null'] }
            supervisor:
              type: [object, 'null']
              properties:
                http_status: { type: integer }
                body: {}
            requeried: { type: boolean }
            recorded_at: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, SCOPE_DENIED, REPO_SCOPE_DENIED, ROLE_MISMATCH, VERIFIED_FROM_AGENT_DENIED,
                 AGENT_READ_DENIED, NOT_FOUND, SELF_REVIEW_DENIED, NO_CHECKPOINT, NO_CURRENT_ASSIGNMENT, INTERNAL]
        message: { type: string, minLength: 1 }
    Rejection:
      type: object
      additionalProperties: false
      required: [code, field, message, correction, retryable_after_edit]
      properties:
        code:
          type: string
          enum: [MISSING_FIELD, SCHEMA_VIOLATION, DIGEST_MISMATCH, DUPLICATE_TASK_ID, UNDEFINED_PREREQUISITE,
                 DEPENDENCY_CYCLE, UNKNOWN_PROFILE_ITEM, UNBOUND_DRAFT, REVISION_CONFLICT, REVISION_SUPERSEDED, TASK_ID_CONFLICT,
                 UNRESOLVED_PREREQUISITE, DUPLICATE_TASK_NAME, ESTIMATE_RANGE_REVERSED,
                 IDEMPOTENCY_KEY_CONFLICT, EVENT_CONTENT_CONFLICT, REPORT_SEMANTIC_VIOLATION, INVALID_CURSOR,
                 STALE_ASSIGNMENT, ASSIGNMENT_SHA_MISMATCH, OWNERSHIP_CONFLICT, PREREQUISITE_UNMET, LIMIT_REACHED,
                 SEMANTIC_REVIEW_NOT_PASSED, UNKNOWN_SPRINT_REVISION, UNKNOWN_TASK, REPO_MISMATCH,
                 NO_CURRENT_ASSIGNMENT, OUTBOX_STATE_CONFLICT, SPRINT_REPO_CONFLICT, IMPORT_GATED, IMPORT_INCOMPLETE,
                 CHECKPOINT_SEQUENCE_GAP, CHECKPOINT_MISMATCH, ATTEMPT_ID_CONFLICT, DELIVERY_IN_PROGRESS]
        field: { type: string }
        message: { type: string, minLength: 1 }
        correction: { type: string, minLength: 1 }
        retryable_after_edit: { type: boolean }
    RejectionList:
      type: object
      additionalProperties: false
      required: [rejections]
      properties:
        rejections:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Rejection' }
    RegistrationResult:
      type: object
      additionalProperties: false
      required: [sprint_id, revision, digest, state, mode]
      properties:
        mode: { type: string, enum: [draft, executable] }
        sprint_id: { type: string }
        revision: { type: integer, minimum: 1 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        state: { type: string, enum: [ACCEPTED_FOR_SEMANTIC_REVIEW, ALREADY_REGISTERED, SUPERSEDED] }
        superseded_by:
          description: Latest registered revision when this revision is no longer active.
          type: integer
          minimum: 2
    ConversionResult:
      type: object
      additionalProperties: false
      required: [conversion, registration]
      properties:
        conversion:
          type: object
          required: [input_digest, spec, name_to_task_id, generated_fields, preserved_unrepresented, semantic_review_required, unresolved_bindings]
          properties:
            input_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
            spec: { $ref: '../docs/poc/SprintSpec_v0.schema.json' }
            name_to_task_id: { type: object, additionalProperties: { type: string } }
            generated_fields: { type: array, items: { type: string } }
            preserved_unrepresented: { type: object }
            semantic_review_required: { type: array, items: { type: string } }
            unresolved_bindings: { type: array, items: { type: string } }
        registration: { $ref: '#/components/schemas/RegistrationResult' }
    FirstActionReceipt:
      type: object
      additionalProperties: false
      required: [assignment_id, generation, attempt_id, session_id, evidence_level, current_assignment, received_at]
      properties:
        assignment_id: { type: string }
        generation: { type: integer }
        attempt_id: { type: string }
        session_id: { type: string }
        evidence_level: { type: string, const: claim }
        current_assignment:
          type: boolean
          description: As stored; false when the assignment had moved on after the session's takeover
        received_at: { type: string, format: date-time }
    SessionStatusReceipt:
      type: object
      additionalProperties: false
      required: [idempotency_key, observed_at, evidence_level, stale_on_arrival, current_assignment, received_at]
      properties:
        idempotency_key: { type: string }
        observed_at: { type: string, format: date-time }
        evidence_level: { type: string, const: claim }
        stale_on_arrival: { type: boolean }
        current_assignment: { type: [boolean, 'null'] }
        received_at: { type: string, format: date-time }
    ClaimReceipt:
      type: object
      additionalProperties: false
      required: [event_id, event_revision, stored_at, evidence_level, disposition, assignment_id, generation, attributed_target_sha, counts_for_current_judgment]
      properties:
        event_id: { type: string }
        event_revision: { type: integer, minimum: 1 }
        stored_at: { type: string, format: date-time }
        evidence_level: { const: claim }
        disposition:
          description: current = may feed the current judgment; preserved_late = kept for its original assignment/SHA only.
          type: string
          enum: [current, preserved_late]
        assignment_id: { type: string }
        generation: { type: integer, minimum: 0 }
        attributed_target_sha:
          description: SHA recorded for that assignment in the coordinator DB (never taken from the claim body).
          type: string
        counts_for_current_judgment:
          description: Evaluated at response time (a replay after the assignment moved on returns false).
          type: boolean
    ReproRequest:
      type: object
      additionalProperties: false
      required: [request_id, repo_id, assignment_id, generation, target_sha, bundle_digest, command, expected]
      properties:
        request_id: { type: string, minLength: 8, maxLength: 128 }
        repo_id: { type: string, minLength: 1 }
        assignment_id: { type: string, minLength: 1 }
        generation: { type: integer, minimum: 0 }
        target_sha: { type: string, pattern: '^[a-f0-9]{40,64}$' }
        bundle_digest:
          description: SHA-256 of the files/patch the Guardrail wrote in its scratch area (uploaded by the supervisor).
          type: string
          pattern: '^[a-f0-9]{64}$'
        command: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        expected: { type: string, minLength: 1 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600 }
    ReproStatus:
      type: object
      additionalProperties: false
      required: [request_id, state, target_sha]
      properties:
        request_id: { type: string }
        state: { type: string, enum: [queued, running, finished, runner_failed, rejected_stale_generation] }
        target_sha: { type: string }
        runner_image_digest: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        raw_log_refs: { type: array, items: { type: string } }
        finished_at: { type: [string, 'null'], format: date-time }
    SprintState:
      type: object
      additionalProperties: false
      required: [sprint_id, sprint_revision, verified, latest_claims, last_observed_at, delivery]
      properties:
        sprint_id: { type: string }
        sprint_revision: { type: integer, minimum: 1 }
        verified:
          description: Latest coordinator_to_client report per task; empty before any verdict.
          type: array
          items:
            allOf:
              - $ref: '../docs/poc/ProgressReport_v0.schema.json'
              - type: object
                required: [evidence_level, channel]
                properties:
                  evidence_level: { const: verified }
                  channel: { const: coordinator_to_client }
        latest_claims:
          description: Latest agent claims, kept separate so a client cannot mistake them for verdicts.
          type: array
          items:
            allOf:
              - $ref: '../docs/poc/ProgressReport_v0.schema.json'
              - type: object
                required: [evidence_level, channel]
                properties:
                  evidence_level: { const: claim }
                  channel: { const: agent_to_coordinator }
        last_observed_at: { type: [string, 'null'], format: date-time }
        delivery:
          description: External delivery of the latest verified report; independent of task verdicts.
          type: string
          enum: [pending, sent, unknown]
