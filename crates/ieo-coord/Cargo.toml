[package]
name = "ieo-coord"
version = "0.1.0"
description = "Coordinator DB schema, authenticated HTTP/JSON API and internal gRPC adapter, assignments, events, outbox and read model (02-03)"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ieo-spec = { path = "../ieo-spec" }
ieo-report = { path = "../ieo-report" }
# 02-05 step 3: the shared budget check of the delivery path (the 02-04 caller's code)
ieo-supervisor = { path = "../ieo-supervisor" }
# 02-05 budget: the spare approval time (UTC RFC 3339, the evidence clock)
ieo-evidence = { path = "../ieo-evidence" }
hex = "0.4.3"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12"
signal-hook = "0.3"
ureq = { version = "2", default-features = false, features = ["json"] }
# X-04 gRPC adapter (contracts/ieo-internal-v0.md)
ieo-proto = { path = "../ieo-proto" }
tonic = "0.14"
tonic-health = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }

[dev-dependencies]
# X-04 regression: a relay that drops answers after commit
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true
