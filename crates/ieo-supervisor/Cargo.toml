edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
tiny_http = "0.12"
sha2 = "0.11.1"
signal-hook = "0.3"
nix = { version = "0.29", features = ["process"] }

[dev-dependencies]
ieo-evidence = { path = "../ieo-evidence" }

[lints]
workspace = true
