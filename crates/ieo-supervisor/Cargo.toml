[package]
name = "ieo-supervisor"
version = "0.1.0"
description = "02-04 repo supervisor core without model calls: role arguments, environment, CLAUDE_CONFIG_DIR cleanup and tamper detection, single-run lock, checkpoint/reconnect decision, budget guard"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
tiny_http = "0.12"
sha2 = "0.11.1"
signal-hook = "0.3"
nix = { version = "0.29", features = ["process"] }
ieo-evidence = { path = "../ieo-evidence" }
ureq = { version = "2", default-features = false, features = ["json"] }
# X-04: the coordinator over gRPC (checkpoint_central.transport = "grpc")
ieo-proto = { path = "../ieo-proto" }
tonic = "0.14"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
# X-04: the fake central record over gRPC
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
